[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "1.2.1"
description = "Shared agent runtime for graph-orchestrated ML services"
requires-python = ">=3.11"
dependencies = [
    "ml-core @ git+https://github.com/milos-plavsic/ml-core.git@v1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "langgraph==0.0.32",
    "langchain-core==0.1.45",
]

[tool.setuptools.packages.find]
where = ["src"]
